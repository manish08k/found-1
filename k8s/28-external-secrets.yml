# Replaces the `stringData: CHANGE_ME` placeholders in
# k8s/00-namespace-config.yml with secrets pulled live from AWS Secrets
# Manager. Requires the External Secrets Operator installed in-cluster:
# https://external-secrets.io — swap SecretStore for Vault/GCP/Azure
# backends if you're not on AWS, the shape is the same.
#
# Once this is applied, DELETE the `autoflow-secrets` Secret block from
# k8s/00-namespace-config.yml (or leave it — this ExternalSecret will just
# overwrite the same object name on its refresh interval).

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: autoflow
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # IRSA (IAM Roles for Service Accounts) — no long-lived AWS keys
        # sitting in the cluster. Bind this SA to an IAM role scoped to
        # only the autoflow/* secret paths below.
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: autoflow
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/autoflow-external-secrets"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: autoflow-secrets
  namespace: autoflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: autoflow-secrets   # produces the same k8s Secret name the app already reads from
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: autoflow/prod/database_url
    - secretKey: APP_SECRET_KEY
      remoteRef:
        key: autoflow/prod/app_secret_key
    - secretKey: CREDENTIAL_ENCRYPTION_KEY
      remoteRef:
        key: autoflow/prod/credential_encryption_key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-secrets
  namespace: autoflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: pgbouncer-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: autoflow/prod/db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: autoflow/prod/db_password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: autoflow/prod/slack_webhook_url
    - secretKey: PAGERDUTY_SERVICE_KEY
      remoteRef:
        key: autoflow/prod/pagerduty_service_key
