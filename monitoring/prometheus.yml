global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: autoflow-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Only resolves in the k8s deployment (k8s/25-pgbouncer.yml) unless you
  # also add a pgbouncer + pgbouncer-exporter service to docker-compose.yml.
  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
