# Default-deny + explicit allows. Without this, any compromised pod in the
# `autoflow` namespace (or, depending on CNI config, the cluster) can reach
# Postgres/Redis directly. Requires a CNI that enforces NetworkPolicy
# (Calico, Cilium, etc — the default kubenet/AWS VPC CNI needs the add-on).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: autoflow
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

---
# DNS must stay open for every pod or nothing else resolves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: autoflow
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Ingress controller -> API pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  namespace: autoflow
spec:
  podSelector:
    matchLabels:
      app: autoflow-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

---
# API + worker + beat -> PgBouncer only (not Postgres directly).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-pgbouncer
  namespace: autoflow
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: autoflow-api
        - podSelector:
            matchLabels:
              app: autoflow-worker
        - podSelector:
            matchLabels:
              app: autoflow-beat

---
# PgBouncer -> Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-to-postgres
  namespace: autoflow
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pgbouncer

---
# API + worker + beat -> Redis (cache + Celery broker/results).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis
  namespace: autoflow
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: autoflow-api
        - podSelector:
            matchLabels:
              app: autoflow-worker
        - podSelector:
            matchLabels:
              app: autoflow-beat

---
# API + worker -> public internet (OAuth providers, webhooks, user-configured
# databases for the database.* nodes, etc). Metadata-IP / private-range
# access is still blocked in-app by core/ssrf_guard.py and the database
# integration's own host validation — this policy is defense-in-depth, not
# a substitute for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-internet
  namespace: autoflow
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["autoflow-api", "autoflow-worker", "autoflow-beat"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pgbouncer
    - to:
        - podSelector:
            matchLabels:
              app: redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # cloud metadata
              - 10.0.0.0/8           # private ranges — reachable only via
              - 172.16.0.0/12        # the explicit allows above, not
              - 192.168.0.0/16       # arbitrary internal pod/node IPs
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
